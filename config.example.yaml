# shortsCreator configuration.
#
# Copy to config.yaml and edit. Every section is optional — anything you leave
# out falls back to the defaults shown here, so a minimal config is just the
# `roots` and `output` blocks.

roots:
  movies: /srv/local_movies
  tv: /srv/local_tvshows

output:
  # Finished .mp4 shorts, their thumbnails, and per-series sidecar JSON.
  dir: /srv/shorts_output

cache:
  # Generated transcripts and extracted subtitle tracks. Safe to delete; it
  # only costs re-transcription time.
  dir: ~/.cache/shortscreator

database:
  # The dashboard contract. Point this at the Home Lab Dashboard's data/
  # directory — that path is already a mounted, gitignored Docker volume, so
  # the DB survives container redeploys without any compose change.
  path: /opt/homelab-dashboard/data/shorts.db

quotes:
  path: quotes.json
  categories: categories.yaml

subtitles:
  # Stream selection is language-aware rather than a hardcoded 0:s:0. The first
  # language tag found wins; untagged text streams are tried next.
  preferred_languages: [eng, en, english]

  # Level-2 validation: a *listed* subtitle stream is not proof of a *usable*
  # one, so an extracted track has to clear all of these before it's trusted.
  min_cues: 20
  min_chars: 500

  # The gate that earns its keep. A "forced" track parses perfectly but only
  # covers foreign-language lines — a handful of cues across a whole film. It
  # would look healthy and match almost nothing. Requiring the last cue to land
  # past the halfway mark catches exactly that case.
  min_coverage: 0.5

matching:
  # rapidfuzz token_sort_ratio, 0-100, on normalized text. 72 is permissive
  # enough to survive paraphrasing in hand-written quotes while still rejecting
  # unrelated dialogue. Raise it if you get wrong-moment clips; lower it if too
  # many titles are skipped.
  threshold: 72

  # Quotes rarely align to cue boundaries, so candidates are matched against
  # sliding windows of 1..N consecutive cues joined together.
  window_max_cues: 3

clip:
  min_duration: 20
  max_duration: 60
  pad_before: 1.5
  # How long to hold after the matched line, so it has room to land.
  pad_after: 2.0

  # Where the matched line sits in the finished clip.
  #
  #   punchline - the line lands near the END, with the dialogue that leads up
  #               to it running in front. This is the default because a quote is
  #               almost always the line that LANDS, not the one that sets it
  #               up. Centring it instead puts the payoff in the middle and then
  #               runs on into unrelated conversation.
  #   center    - the old behaviour, for quotes that open something rather than
  #               close it.
  anchor: punchline

  # Clips start at a gap in the dialogue at least this long, so they open on a
  # beat instead of halfway through someone's sentence. The latest qualifying
  # pause wins: the tightest clip that still opens cleanly.
  boundary_gap: 0.8

  # Ignore matches that land in the first N seconds — opening credits, recaps,
  # "previously on". Footage under a title card makes a useless clip however
  # good the line is. Per-library, so start at 0 and raise it if you see credit
  # text in your output; ~150 suits a sitcom whose titles run over the first
  # scene.
  skip_first_seconds: 0

video:
  width: 1080
  height: 1920
  blur_sigma: 20

  # Aspect ratio of the sharp centre panel. The source is CROPPED to fill it,
  # so 4:5 from a 16:9 original loses roughly half the frame width in exchange
  # for a much larger subject — which is the trade this format wants, since a
  # full-width 16:9 strip on a phone is a small picture surrounded by blur.
  #
  # 4:5   tall panel, heavy side crop (default)
  # 1:1   square, heavier crop still
  # 16:9  no crop at all, smallest picture
  # null  fit the full width and crop nothing (the original behaviour)
  #
  # Wide establishing shots suffer most from the crop; dialogue, which is what
  # a quote-driven clip is made of, is usually centre-framed and survives fine.
  foreground_aspect: "4:5"

  # libx264 is the quality default. h264_nvenc is much faster on the GTX 1080,
  # at a small quality cost that matters little for clips YouTube re-encodes
  # anyway. Note the blur and caption filters are CPU-only either way — gblur
  # has no CUDA equivalent — so NVENC speeds up encoding, not filtering.
  encoder: libx264       # or: h264_nvenc
  crf: 18
  preset: medium
  nvenc_cq: 19
  nvenc_preset: p5

captions:
  # ASS colors are &HAABBGGRR — alpha first, then BLUE GREEN RED. 00 alpha is
  # fully opaque. This trips everyone up at least once.
  font: Arial
  font_size: 64
  primary_colour: "&H00FFFFFF"   # white
  outline_colour: "&H00000000"   # black
  back_colour: "&H80000000"      # 50% black, only used when border_style: 3
  bold: true
  border_style: 1                # 1 = outline+shadow, 3 = opaque box
  outline: 4                     # heavy, so it stays legible on any footage
  shadow: 1
  alignment: 2                   # 2 = bottom-center
  margin_v: 320                  # lifts captions clear of the UI safe area
  margin_l: 60
  margin_r: 60

part_badge:
  # The "Part 2/4" marker on multipart series.
  enabled: true
  font: Arial
  font_size: 44
  primary_colour: "&H00FFFFFF"
  outline_colour: "&H00000000"
  outline: 3
  shadow: 0
  alignment: 9                   # 9 = top-right
  margin_v: 90
  margin_l: 50
  margin_r: 50

multipart:
  min_parts: 3                   # below this, skip the title rather than ship a stub series
  max_parts: 5
  # Two quotes from the same scene would become two near-identical shorts.
  # Matches closer together than this are clustered and only the best kept.
  min_separation: 180

recap:
  # A recap is ONE clip that cuts between several moments — a rundown of an
  # episode rather than a single joke. Segments are a fixed length and are not
  # snapped to pauses: a montage cuts hard by convention, and a fixed length
  # keeps the total predictable, so a 45-second recap comes out at 45 seconds.
  duration: 45
  min_segments: 4
  max_segments: 8
  segment_min: 4              # below this a segment is a flash, not a moment
  min_separation: 20          # moments closer than this are near-duplicates

  # A recap picks the best moment from each ACT rather than the best N overall.
  # Ranking purely by score clusters wherever the strongest lines happen to
  # fall — usually the middle, since that is where most of an episode is — and
  # a rundown that skips the opening and the ending is not a rundown.
  #
  # Compilations always rank by score instead: timestamps from different
  # episodes are not comparable.

whisper:
  enabled: true
  # distil-large-v3 is English-only, near large-v3 accuracy, far cheaper. Better
  # transcription directly raises match rates, so this is worth the VRAM.
  model: distil-large-v3
  device: cuda                   # falls back to cpu automatically if unavailable

  # NOT float16. Pascal (GTX 10xx) runs fp16 at 1/64 rate, so float16 on this
  # card is dramatically SLOWER than integer math. Compute capability 6.1 does
  # have fast int8 via DP4A, which is what this uses.
  compute_type: int8_float32
  cpu_compute_type: int8

  beam_size: 5
  vad_filter: true

  # Transcription is chunked so it can be interrupted at a boundary when
  # someone starts watching — see yield_to_viewers. Losing one chunk is
  # acceptable; losing a two-hour transcription is not.
  chunk_seconds: 600

yield_to_viewers:
  # Hard requirement, not a tuning knob: this box is also the Plex server, and
  # pipeline work must never degrade someone's playback.
  enabled: true
  pause_on_any_stream: true      # any playback at all, not just transcodes
  resume_after_idle: 300         # quiet period before work resumes (hysteresis:
                                 # the gap between two episodes shouldn't restart
                                 # heavy work)
  heartbeat_stale_after: 60      # dashboard silent this long -> assume viewers,
                                 # stay paused. Safe default is "someone might be
                                 # watching".

worker:
  # The worker is deliberately serial: this box is also the Plex server on four
  # shared cores, and a second concurrent render buys little while costing
  # playback headroom. These are politeness settings, not throughput ones.
  nice: 10                       # CPU priority for ffmpeg and whisper
  ionice_class: 3                # I/O priority: 3 = idle (Linux only)
